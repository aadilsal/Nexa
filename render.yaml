# Render Blueprint — Nexa API (free web service)
# Docs: https://render.com/docs/blueprint-spec
#
# After connect: set secret env vars in the Render dashboard (DATABASE_URL, KEK, etc.)

services:
  - type: web
    name: nexa-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ANALYTICS_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KEK
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ANALYTICS_USER_HASH_SALT
        sync: false
      - key: ANALYTICS_EVENT_SIGNING_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
