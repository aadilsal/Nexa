name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Public Convex URL (it ships in the browser bundle anyway). The web build refuses to
      # compile without it, so CI needs the same value Vercel has.
      NEXT_PUBLIC_CONVEX_URL: https://unique-buzzard-147.convex.cloud

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - run: pnpm --filter @nexa/shared build
      - run: pnpm --filter @nexa/finance-engine build
      - run: pnpm --filter @nexa/finance-engine test
      - run: pnpm --filter @nexa/web build
