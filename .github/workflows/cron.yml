name: Cron

on:
  schedule:
    # Weekly review emails — Monday 08:00 UTC
    - cron: "0 8 * * 1"
    # Daily maintenance — 03:00 UTC
    - cron: "0 3 * * *"
    # Admin aggregation — 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  weekly-review:
    if: github.event.schedule == '0 8 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly review emails
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$API_URL" ]; then
            echo "Skipping — CRON_SECRET or NEXT_PUBLIC_API_URL not configured"
            exit 0
          fi
          curl -sf -X POST "${API_URL%/}/reviews/weekly/send" \
            -H "x-cron-secret: $CRON_SECRET"

  daily-maintenance:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Purge expired accounts
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$API_URL" ]; then
            echo "Skipping — CRON_SECRET or NEXT_PUBLIC_API_URL not configured"
            exit 0
          fi
          curl -sf -X POST "${API_URL%/}/account/purge-expired" \
            -H "x-cron-secret: $CRON_SECRET"

  admin-aggregation:
    if: github.event.schedule == '30 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Sync user directory
        env:
          API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$API_URL" ]; then
            echo "Skipping — CRON_SECRET or NEXT_PUBLIC_API_URL not configured"
            exit 0
          fi
          curl -sf -X POST "${API_URL%/}/admin/sync/user-directory" \
            -H "x-cron-secret: $CRON_SECRET"
          curl -sf -X POST "${API_URL%/}/admin/aggregate/daily" \
            -H "x-cron-secret: $CRON_SECRET"
